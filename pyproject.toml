[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-trimmer"
version = "0.1.0"
description = "Multi-turn dialogue context trimming with deterministic rules"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
context-trimmer = "context_trimmer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
